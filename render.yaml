services:
  - type: worker
    name: zyveron-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DB_PATH
        value: /var/data/zyveron.db
    disk:
      name: zyveron-data
      mountPath: /var/data
      sizeGB: 1
